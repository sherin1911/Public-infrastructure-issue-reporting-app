<!DOCTYPE html>
<html>
<head>
    <title>My Reported Issues</title>
</head>
<body>

<h2>Reported Issues</h2>

<table border="1" cellpadding="10">

<tr>
    <th>ID</th>
    <th>Category</th>
    <th>Location</th>
    <th>Description</th>
    <th>Status</th>
</tr>

{% for issue in issues %}
<tr>
    <td>{{ issue[0] }}</td>
    <td>{{ issue[1] }}</td>
    <td>{{ issue[2] }}</td>
    <td>{{ issue[3] }}</td>
    <td>{{ issue[4] }}</td>
</tr>
{% endfor %}

</table>

<br>

<a href="/">Back to Home</a>

</body>
</html>
