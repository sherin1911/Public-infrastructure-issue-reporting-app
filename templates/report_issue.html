<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Report Issue | CivicConnect</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet">

    <style>

        body {
            background: linear-gradient(135deg, #eff6ff, #f5f3ff);
            min-height: 100vh;
            font-family: Arial, sans-serif;
        }

        .navbar {
            background: linear-gradient(90deg, #2563eb, #4f46e5);
        }

        .navbar-brand,
        .nav-link {
            color: white !important;
        }

        .main-card {
            max-width: 850px;
            margin: 50px auto;
            background: white;
            border-radius: 25px;
            padding: 35px;
            box-shadow: 0 15px 40px rgba(37, 99, 235, 0.15);
        }

        .page-title {
            color: #1e3a8a;
            font-weight: 800;
        }

        .form-label {
            font-weight: 600;
            color: #334155;
        }

        .form-control,
        .form-select {
            border-radius: 12px;
            padding: 12px;
            border: 1px solid #cbd5e1;
        }

        .form-control:focus,
        .form-select:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 0.2rem rgba(37, 99, 235, 0.15);
        }

        /* LOCATION BOX */

        .location-box {
            position: relative;
        }

        .location-input {
            padding-left: 45px !important;
            padding-right: 50px !important;
        }

        .location-search-icon {
            position: absolute;
            left: 15px;
            top: 14px;
            color: #2563eb;
            font-size: 20px;
            z-index: 5;
        }

        .location-button {
            position: absolute;
            right: 8px;
            top: 7px;
            border: none;
            background: #eff6ff;
            color: #2563eb;
            border-radius: 10px;
            padding: 7px 10px;
        }

        .location-button:hover {
            background: #dbeafe;
        }

        .location-suggestions {
            position: absolute;
            left: 0;
            right: 0;
            top: 58px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.12);
            z-index: 1000;
            overflow: hidden;
            display: none;
        }

        .suggestion-item {
            padding: 13px 16px;
            cursor: pointer;
            border-bottom: 1px solid #f1f5f9;
        }

        .suggestion-item:hover {
            background: #eff6ff;
        }

        .suggestion-icon {
            color: #ef4444;
            margin-right: 8px;
        }

        .current-location {
            margin-top: 10px;
            color: #2563eb;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
        }

        .current-location:hover {
            text-decoration: underline;
        }

        /* UPLOAD */

        .upload-box {
            border: 2px dashed #60a5fa;
            background: #eff6ff;
            border-radius: 18px;
            padding: 25px;
            text-align: center;
        }

        .upload-icon {
            font-size: 42px;
            color: #2563eb;
        }

        #imagePreview {
            display: none;
            max-height: 220px;
            max-width: 100%;
            margin: 20px auto 0;
            border-radius: 15px;
            object-fit: cover;
        }

        .btn-submit {
            background: linear-gradient(90deg, #2563eb, #7c3aed);
            border: none;
            color: white;
            padding: 13px 30px;
            border-radius: 12px;
            font-weight: 700;
        }

        .btn-submit:hover {
            color: white;
            transform: translateY(-2px);
        }

    </style>

</head>


<body>


<!-- NAVBAR -->

<nav class="navbar navbar-expand-lg">

    <div class="container">

        <a
            class="navbar-brand fw-bold"
            href="/">

            <i class="bi bi-building-check"></i>

            CivicConnect

        </a>

        <div>

            <a
                class="nav-link d-inline-block"
                href="/">

                Home

            </a>

            <a
                class="nav-link d-inline-block"
                href="/issues">

                My Issues

            </a>

            <a
                class="nav-link d-inline-block"
                href="/logout">

                Logout

            </a>

        </div>

    </div>

</nav>


<!-- MAIN -->

<div class="container">

    <div class="main-card">


        <!-- TITLE -->

        <div class="text-center mb-4">

            <div class="display-5 text-primary mb-2">

                <i class="bi bi-megaphone-fill"></i>

            </div>

            <h1 class="page-title">

                Report a Public Issue

            </h1>

            <p class="text-muted">

                Help improve your community by reporting infrastructure problems.

            </p>

        </div>


        <form
            method="POST"
            action="/report"
            enctype="multipart/form-data">


            <!-- CATEGORY -->

            <div class="mb-4">

                <label class="form-label">

                    <i class="bi bi-grid-fill text-primary"></i>

                    Issue Category

                </label>

                <select
                    name="category"
                    class="form-select"
                    required>

                    <option value="">
                        Select an issue category
                    </option>

                    <option value="Road Damage">
                        🛣️ Road Damage
                    </option>

                    <option value="Street Light">
                        💡 Street Light
                    </option>

                    <option value="Garbage">
                        🗑️ Garbage
                    </option>

                    <option value="Water Leakage">
                        💧 Water Leakage
                    </option>

                    <option value="Drainage">
                        🌧️ Drainage
                    </option>

                    <option value="Traffic Signal">
                        🚦 Traffic Signal
                    </option>

                    <option value="Public Toilet">
                        🚻 Public Toilet
                    </option>

                    <option value="Other">
                        📌 Other
                    </option>

                </select>

            </div>


            <!-- LOCATION -->

            <div class="mb-4">

                <label class="form-label">

                    <i class="bi bi-geo-alt-fill text-danger"></i>

                    Issue Location

                </label>


                <div class="location-box">

                    <i
                        class="bi bi-search location-search-icon">
                    </i>


                    <input
                        type="text"
                        name="location"
                        id="locationInput"
                        class="form-control location-input"
                        placeholder="Search your location..."
                        autocomplete="off"
                        required>


                    <button
                        type="button"
                        class="location-button"
                        onclick="getCurrentLocation()"
                        title="Use my current location">

                        <i class="bi bi-crosshair"></i>

                    </button>


                    <div
                        id="suggestions"
                        class="location-suggestions">
                    </div>

                </div>


                <div
                    class="current-location"
                    onclick="getCurrentLocation()">

                    <i class="bi bi-geo-alt-fill"></i>

                    Use my current location

                </div>

                <small class="text-muted">

                    Search for a place or use your current GPS location.

                </small>

            </div>


            <!-- DESCRIPTION -->

            <div class="mb-4">

                <label class="form-label">

                    <i class="bi bi-chat-left-text-fill text-primary"></i>

                    Description

                </label>

                <textarea
                    name="description"
                    class="form-control"
                    rows="5"
                    placeholder="Describe the problem clearly..."
                    required></textarea>

            </div>


            <!-- IMAGE -->

            <div class="mb-4">

                <label class="form-label">

                    <i class="bi bi-camera-fill text-success"></i>

                    Upload Picture

                    <span class="text-muted fw-normal">

                        (Optional)

                    </span>

                </label>


                <div class="upload-box">

                    <div class="upload-icon">

                        <i class="bi bi-cloud-arrow-up-fill"></i>

                    </div>

                    <h5 class="mt-2">

                        Upload a photo of the issue

                    </h5>

                    <p class="text-muted">

                        PNG, JPG, JPEG, GIF or WEBP · Maximum 5 MB

                    </p>


                    <input
                        type="file"
                        name="image"
                        id="imageInput"
                        class="form-control"
                        accept=".png,.jpg,.jpeg,.gif,.webp">


                    <img
                        id="imagePreview"
                        alt="Image Preview">

                </div>

            </div>


            <!-- SUBMIT -->

            <div class="text-center">

                <button
                    type="submit"
                    class="btn btn-submit">

                    <i class="bi bi-send-fill"></i>

                    Submit Issue

                </button>

            </div>


        </form>

    </div>

</div>


<script>


/* =========================================
   IMAGE PREVIEW
========================================= */

document
.getElementById("imageInput")
.addEventListener("change", function(event) {

    const file = event.target.files[0];

    const preview =
        document.getElementById("imagePreview");

    if (file) {

        preview.src =
            URL.createObjectURL(file);

        preview.style.display = "block";

    } else {

        preview.style.display = "none";

    }

});


/* =========================================
   LOCATION SEARCH
========================================= */

const locationInput =
    document.getElementById("locationInput");

const suggestions =
    document.getElementById("suggestions");


let searchTimer;


/* Search when user types */

locationInput.addEventListener(
    "input",
    function() {

        clearTimeout(searchTimer);

        const query =
            locationInput.value.trim();

        if (query.length < 3) {

            suggestions.style.display = "none";

            return;

        }

        searchTimer =
            setTimeout(
                function() {

                    searchLocation(query);

                },
                500
            );

    }
);


/* Search OpenStreetMap */

async function searchLocation(query) {

    try {

        const url =
            "https://nominatim.openstreetmap.org/search?format=json&limit=5&q="
            + encodeURIComponent(query);

        const response =
            await fetch(url, {
                headers: {
                    "Accept": "application/json"
                }
            });

        const data =
            await response.json();


        suggestions.innerHTML = "";


        if (data.length === 0) {

            suggestions.style.display = "none";

            return;

        }


        data.forEach(
            function(place) {

                const item =
                    document.createElement("div");

                item.className =
                    "suggestion-item";


                item.innerHTML =

                    '<i class="bi bi-geo-alt-fill suggestion-icon"></i>'
                    +
                    place.display_name;


                item.addEventListener(
                    "click",
                    function() {

                        locationInput.value =
                            place.display_name;

                        suggestions.style.display =
                            "none";

                    }
                );


                suggestions.appendChild(item);

            }
        );


        suggestions.style.display =
            "block";

    }

    catch(error) {

        console.log(
            "Location search error:",
            error
        );

    }

}


/* =========================================
   CURRENT GPS LOCATION
========================================= */

function getCurrentLocation() {

    if (!navigator.geolocation) {

        alert(
            "Geolocation is not supported by your browser."
        );

        return;

    }


    locationInput.value =
        "Detecting your location...";


    navigator.geolocation.getCurrentPosition(

        async function(position) {

            const latitude =
                position.coords.latitude;

            const longitude =
                position.coords.longitude;


            try {

                const url =
                    "https://nominatim.openstreetmap.org/reverse?format=json&lat="
                    + latitude
                    + "&lon="
                    + longitude;


                const response =
                    await fetch(url, {
                        headers: {
                            "Accept": "application/json"
                        }
                    });


                const data =
                    await response.json();


                if (data.display_name) {

                    locationInput.value =
                        data.display_name;

                }

                else {

                    locationInput.value =
                        latitude
                        + ", "
                        + longitude;

                }

            }

            catch(error) {

                locationInput.value =
                    latitude
                    + ", "
                    + longitude;

            }

        },


        function(error) {

            locationInput.value = "";

            alert(
                "Unable to get your current location. Please allow location access in your browser."
            );

        }

    );

}


/* =========================================
   CLOSE SUGGESTIONS
========================================= */

document.addEventListener(
    "click",
    function(event) {

        if (
            !event.target.closest(".location-box")
        ) {

            suggestions.style.display =
                "none";

        }

    }
);

</script>


</body>

</html>
